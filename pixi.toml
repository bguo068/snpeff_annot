[workspace]
authors = ["Bing.Guo <bing.guo@som.umaryland.edu>"]
channels = ["conda-forge", "bioconda"]
name = "snpeff_annot"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# Build the snpEff database (default PlasmoDB-44_Pfalciparum3D7) once, before
# annotating; extra arguments pass through, e.g. `pixi run setup --genome_version 68`.
setup = { cmd = "./makedb.py", description = "Build the snpEff database of a PlasmoDB genome, if missing" }
snpeff_annot = { cmd = "./snpeff_annot.py", description = "Annotate a VCF with snpEff and export a TSV table" }

[dependencies]
snpeff = ">=5.4.0c,<6"
pandas = ">=3.0.5,<4"
bcftools = ">=1.24,<2"
ruff = ">=0.16.7,<0.17"
ty = ">=0.0.80,<0.0.81"
wget = ">=1.25.0,<2"

[feature.dev.dependencies]
ipython = "*"

[environments]
dev = ["dev", "default"]
